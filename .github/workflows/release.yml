name: Release build

# Builds the Poodle Earth release files from one commit in the pinned toolchain containers.
# It uploads them as a workflow artifact and publishes nothing: tagging and creating the GitHub
# release stay manual steps. Run it from the Actions tab (choose the branch or tag) or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: StuffIt archive, source archive and checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Pinned by digest so the same commit builds with the same toolchains (see RELEASE.json).
      RETRO68_IMAGE: ghcr.io/autc04/retro68@sha256:2c2ec5ca764c98b7460522be7327426e3b4d039a317c22d6ccdcc64e5247f21a
      RUST_IMAGE: docker.io/library/rust@sha256:e97df055c54a05160e7c67ba3b2963de6ddb95903911baf8922dbcd1b394f698
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends podman unar
      - name: Build the Classic application
        run: tools/build-os9.sh --floppy
      - name: Package, strict (clean tree and a build of this exact commit)
        run: GLOBE_RELEASE_STRICT=1 tools/package-release.sh build-os9-floppy
      - name: Record checksums
        run: |
          {
            echo "### Release files for \`$(git rev-parse HEAD)\`"
            echo '```'
            cat build-os9-floppy/release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: poodle-earth-release-${{ github.sha }}
          path: build-os9-floppy/release/*
          if-no-files-found: error
