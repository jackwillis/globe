name: Checks

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            cmake ninja-build clang-18 clang-format-18 clang-tidy-18
      - name: Repository policy
        run: tools/check-policy.sh
      - name: Format check (clang-format 18)
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Configure (GCC, warnings, ASan/UBSan)
        run: cmake -S . -B build -G Ninja -DGLOBE_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Lint (clang-tidy 18)
        run: |
          git ls-files 'src/*.cpp' | xargs clang-tidy-18 -p build --quiet

  clang:
    name: Host build with clang
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends cmake ninja-build clang-18
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  retro68:
    name: Retro68 compile probe (PowerPC and 68k)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Pin by digest once a known-good image is chosen; see docs/toolchain.md.
      RETRO68_IMAGE: ghcr.io/autc04/retro68
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install container runner
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends podman
      - name: Compile core and feature probe
        run: |
          out=$(tools/probe-retro68.sh "$RETRO68_IMAGE" 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep -E '^(==|ok|FAIL)|probe: <'
          ! echo "$out" | grep -q '^FAIL'
