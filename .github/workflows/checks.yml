name: Checks

# Avoid re-running expensive host/Retro68 builds for docs- and site-only changes.
# Cover all source, build inputs, generated-atlas inputs and this workflow itself.
on:
  pull_request:
    paths:
      - '.github/workflows/checks.yml'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitignore'
      - 'CMakeLists.txt'
      - 'atlas/**'
      - 'data/**'
      - 'include/**'
      - 'l10n/**'
      - 'os9/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
  push:
    branches: [main, v2]
    paths:
      - '.github/workflows/checks.yml'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitignore'
      - 'CMakeLists.txt'
      - 'atlas/**'
      - 'data/**'
      - 'include/**'
      - 'l10n/**'
      - 'os9/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            cmake ninja-build pipx python3 libx11-dev xvfb xauth
          pipx install clang-format==22.1.8
          pipx install clang-tidy==22.1.8
      - name: Repository policy
        run: tools/check-policy.sh
      - name: Release manifest unit tests (stdlib)
        run: python3 -m unittest discover -s tests -p test_release_manifest.py -v
      - name: Synthetic atlas composition conformance (stdlib)
        run: python3 -B -m unittest discover -s atlas/research -p 'test_composition_ade.py' -v
      - name: Format check (clang-format 22.1.8)
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Configure (GCC, warnings, ASan/UBSan)
        run: cmake -S . -B build -G Ninja -DGLOBE_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Lint (clang-tidy 22.1.8)
        run: |
          git ls-files 'src/*.cpp' ':!:src/platform/os9/*' | xargs clang-tidy -p build --quiet

      - name: Full edition size report
        run: |
          tools/build-edition.sh full
          cat build-full/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-edition-size-report
          path: build-full/size-report.*

  clang:
    name: Host build with clang
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends cmake ninja-build clang python3 libx11-dev xvfb xauth
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  retro68:
    name: Retro68 compile probe (PowerPC and 68k)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Pin by digest once a known-good image is chosen; see docs/toolchain.md.
      RETRO68_IMAGE: ghcr.io/autc04/retro68
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install container and packaging tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            podman genisoimage faketime hfsutils unar
      - name: Verify hybrid CD format and negative cases
        run: python3 -m unittest discover -s tests -p test_package_cd.py -v
      - name: Compile core and feature probe
        run: |
          out=$(tools/probe-retro68.sh "$RETRO68_IMAGE" 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep -E '^(==|ok|FAIL)|probe: <'
          ! echo "$out" | grep -q '^FAIL'
      - name: Build and package designated OS 9 floppy edition (not executed)
        run: |
          tools/build-os9.sh --floppy
          cat build-os9-floppy/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify release packages and CD reproducibility
        run: |
          GLOBE_RELEASE_STRICT=1 tools/package-release.sh build-os9-floppy
          cd build-os9-floppy/release
          sha256sum -c SHA256SUMS
          isoinfo -d -i PoodleEarth-*-hfs.iso
          isoinfo -f -i PoodleEarth-*-hfs.iso
          tar -tzf PoodleEarth-*-source.tar.gz >/dev/null
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          wc -c PoodleEarth-*-hfs.iso >> "$GITHUB_STEP_SUMMARY"
          cd ../..
          python3 tools/package_cd.py build-os9-floppy "${RUNNER_TEMP}/rebuild.iso" "$(git log -1 --format=%ct)"
          cmp build-os9-floppy/release/PoodleEarth-*-hfs.iso "${RUNNER_TEMP}/rebuild.iso"
      - uses: actions/upload-artifact@v4
        with:
          name: os9-floppy-build-and-size-report
          path: |
            build-os9-floppy/PoodleEarth-Finder.bin
            build-os9-floppy/PoodleEarth-1440.dsk
            build-os9-floppy/size-report.*
            build-os9-floppy/hfs-*.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: poodle-earth-emulator-test
          path: build-os9-floppy/release/*
          if-no-files-found: error
