name: Checks

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            cmake ninja-build pipx python3 libx11-dev xvfb xauth
          pipx install clang-format==22.1.8
          pipx install clang-tidy==22.1.8
      - name: Repository policy
        run: tools/check-policy.sh
      - name: Release manifest unit tests (stdlib)
        run: python3 -m unittest discover -s tests -p test_release_manifest.py -v
      - name: Format check (clang-format 22.1.8)
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: Configure (GCC, warnings, ASan/UBSan)
        run: cmake -S . -B build -G Ninja -DGLOBE_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Lint (clang-tidy 22.1.8)
        run: |
          git ls-files 'src/*.cpp' ':!:src/platform/os9/*' | xargs clang-tidy -p build --quiet

      - name: Full edition size report
        run: |
          tools/build-edition.sh full
          cat build-full/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-edition-size-report
          path: build-full/size-report.*

  clang:
    name: Host build with clang
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends cmake ninja-build clang python3 libx11-dev xvfb xauth
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  retro68:
    name: Retro68 compile probe (PowerPC and 68k)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Pin by digest once a known-good image is chosen; see docs/toolchain.md.
      RETRO68_IMAGE: ghcr.io/autc04/retro68
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install container runner
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends podman
      - name: Compile core and feature probe
        run: |
          out=$(tools/probe-retro68.sh "$RETRO68_IMAGE" 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep -E '^(==|ok|FAIL)|probe: <'
          ! echo "$out" | grep -q '^FAIL'
      - name: Build and package designated OS 9 floppy edition (not executed)
        run: |
          tools/build-os9.sh --floppy
          cat build-os9-floppy/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: os9-floppy-build-and-size-report
          path: |
            build-os9-floppy/PoodleEarth-Finder.bin
            build-os9-floppy/PoodleEarth-1440.dsk
            build-os9-floppy/size-report.*
            build-os9-floppy/hfs-*.txt
